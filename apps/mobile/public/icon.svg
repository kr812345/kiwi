<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kiwiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#30363D" stroke-width="8" />

  <!-- Kiwi Avatar Body Circle -->
  <circle cx="256" cy="256" r="170" fill="url(#kiwiGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="148" fill="#161B22" />

  <!-- Inner Kiwi Flesh / Glow ring -->
  <circle cx="256" cy="256" r="120" fill="#0D1117" stroke="#4CAF50" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Face: [ ^ _ ^ ] -->
  <!-- Left Eye: ^ -->
  <path d="M 195 240 L 215 210 L 235 240" fill="none" stroke="#7EE787" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Eye: ^ -->
  <path d="M 277 240 L 297 210 L 317 240" fill="none" stroke="#7EE787" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smile / Mouth: _ -->
  <path d="M 235 282 Q 256 304 277 282" fill="none" stroke="#7EE787" stroke-width="10" stroke-linecap="round" />

  <!-- Cheek Blushes -->
  <ellipse cx="185" cy="265" rx="14" ry="8" fill="#4CAF50" opacity="0.6" />
  <ellipse cx="327" cy="265" rx="14" ry="8" fill="#4CAF50" opacity="0.6" />

  <!-- Small Kiwi Leaf / Antenna at top -->
  <path d="M 256 95 C 240 60 210 70 215 100 C 230 102 245 100 256 108" fill="#7EE787" />
  <path d="M 256 95 C 275 60 305 70 300 100 C 285 102 270 100 256 108" fill="#4CAF50" />
</svg>
